name: GV Keep-Alive Multi

on:
  schedule:
    - cron: '0 23 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      ### leland.cheung@gmail.com ###
      - name: Pulse LC
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER_LC }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD_LC }}
          GV_GATEWAY: ${{ vars.GV_GATEWAY_LC }}
        run: python main.py

      ### zhou.yin@gmail.com ###
      - name: Pulse YZ
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER_YZ }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD_YZ }}
          GV_GATEWAY: ${{ vars.GV_GATEWAY_YZ }}
        run: python main.py

      ### lelandandyin@gmail.com ###
      - name: Pulse PR
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER_PR }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD_PR }}
          GV_GATEWAY: ${{ vars.GV_GATEWAY_LY }}
        run: python main.py

      ### 8VineyardSt@gmail.com ###
      - name: Pulse 8V
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER_8V }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD_8V }}
          GV_GATEWAY: ${{ vars.GV_GATEWAY_8V }}
        run: python main.py

      ### family@8-v.org (Via Google Workspace Relay) ###
      - name: Pulse FAM
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER_HOME }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD_HOME }}
          GV_GATEWAY: ${{ vars.GV_GATEWAY_FAM }}
          SMTP_HOST: smtp-relay.gmail.com
          ENVELOPE_SENDER: family@8-v.org
        run: python main.py
  
